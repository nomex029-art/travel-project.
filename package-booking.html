<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelVerse – Book a Package</title>
    <link rel="stylesheet" href="package-booking.css" />
  </head>

  <body>
    <input type="checkbox" id="menu-toggle" />
    <label for="menu-toggle" class="menu-overlay"></label>
    <nav class="navbar">
      <a href="index.html" class="logo"
        ><span class="logo-icon">🌍</span> TravelVerse</a
      >
      <label for="menu-toggle" class="hamburger"
        ><span></span><span></span><span></span
      ></label>
      <ul class="nav-links">
        <li class="close-menu"><label for="menu-toggle"></label></li>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="packages.html">Packages</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="contact.html" class="btn-nav">Book Now</a></li>
      </ul>
    </nav>

    <section>
      <div class="section-header">
        <span class="section-tag">Package Booking</span>
        <h2>Book Your Dream Package</h2>
        <p>
          Tell us which package you're interested in, and we'll handle the rest.
        </p>
      </div>
      <div class="booking-wrapper">
        <form
          action="mailto:bookings@travelverse.in"
          method="post"
          enctype="text/plain"
        >
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" name="Full Name" required />

          <label for="email">Email Address *</label>
          <input type="email" id="email" name="Email" required />

          <label for="phone">Phone Number *</label>
          <input type="tel" id="phone" name="Phone" required />

          <label for="package">Select Package *</label>
          <select id="package" name="Package" required>
            <option value="" disabled selected>-- Choose a package --</option>
            <option value="Island Escape">
              Island Escape (5 Days / 4 Nights) – ₹89,999
            </option>
            <option value="European Dream">
              European Dream (10 Days / 9 Nights) – ₹2,49,999
            </option>
            <option value="Mountain Retreat">
              Mountain Retreat (7 Days / 6 Nights) – ₹1,19,999
            </option>
          </select>

          <label for="travelers">Number of Travelers *</label>
          <input
            type="number"
            id="travelers"
            name="Number of Travelers"
            min="1"
            value="2"
            required
          />

          <label for="date">Preferred Travel Date</label>
          <input type="date" id="date" name="Preferred Travel Date" />

          <label for="message">Special Requests / Notes</label>
          <textarea
            id="message"
            name="Special Requests"
            placeholder="Any dietary needs, accessibility requests, etc."
          ></textarea>

          <button type="submit" class="submit-btn">
            🚀 Send Booking Request
          </button>
        </form>
      </div>
    </section>

    <footer>
      <div class="footer-links">
        <a href="index.html">Home</a><a href="destinations.html">Destinations</a
        ><a href="packages.html">Packages</a><a href="reviews.html">Reviews</a
        ><a href="contact.html">Contact</a>
      </div>
      <p class="copyright">© 2024 TravelVerse. All rights reserved.</p>
    </footer>
  </body>
</html>
